services:
  scheduler:
    # Builds from this checkout. To run the published image instead, drop the
    # build line and set image to
    # ghcr.io/elliotmatson/stream-scheduler:latest
    build: .
    image: stream-scheduler:local
    restart: unless-stopped
    # Device discovery uses broadcast and mDNS, which do not cross a bridge
    # network. Host networking is the practical default for a control VLAN;
    # switch to a published port if you add every device by IP instead.
    network_mode: host
    environment:
      # Required. Without a key source the app refuses to start rather than
      # storing stream keys and OAuth tokens in plaintext.
      SCHEDULER_SECRET: ${SCHEDULER_SECRET:?set SCHEDULER_SECRET to a long random string}
      SCHEDULER_PORT: 8500
      # Host networking means this binds the machine's own interfaces, so
      # loopback keeps it to this machine. There is no authentication yet:
      # change to 0.0.0.0 only if you accept that anyone on the network can
      # start broadcasts and read stream keys.
      SCHEDULER_HOST: 127.0.0.1
    volumes:
      - scheduler-config:/config

volumes:
  scheduler-config:
