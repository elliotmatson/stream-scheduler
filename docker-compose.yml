services:
  scheduler:
    # Builds from this checkout. To run the published image instead, drop the
    # build line and set image to
    # ghcr.io/elliotmatson/stream-scheduler:latest
    build: .
    image: stream-scheduler:local
    restart: unless-stopped
    # Published to loopback, which is what decides who can reach this. Change
    # to "8500:8500" to open it to the network, and set a password first.
    #
    # Not host networking. That was here for device discovery, which no
    # adapter actually implements — every device is added by address, and an
    # outbound connection to one works the same either way. Host networking
    # also makes this file impossible to extend, which is what
    # docker-compose.cloudflare.yml needs to do.
    ports:
      - '127.0.0.1:8500:8500'
    environment:
      # Required. Without a key source the app refuses to start rather than
      # storing stream keys and OAuth tokens in plaintext.
      SCHEDULER_SECRET: ${SCHEDULER_SECRET:?set SCHEDULER_SECRET to a long random string}
      SCHEDULER_PORT: 8500
      # Inside the container, where binding anything narrower would stop
      # Docker reaching it at all. What decides who can get to the app is
      # the ports line above, not this.
      SCHEDULER_HOST: 0.0.0.0
      # Sets the password on a new install. It is copied into the database
      # the first time the app starts and never read again, so you can
      # change it in Settings afterwards and it will stick. Leaving this
      # here does not undo that.
      # SCHEDULER_UI_PASSWORD: change-me
      # Where scheduled backups are written, inside the container. What it
      # is worth depends on where the volume below actually lives.
      SCHEDULER_BACKUP_DIR: /backups
    volumes:
      - scheduler-config:/config
      # A separate volume on purpose: a backup sitting in the same place as
      # the database survives a bad restore, and does not survive the disk.
      # Point this at another drive or a NAS mount to make it worth more,
      # e.g.  - /mnt/nas/stream-scheduler:/backups
      - scheduler-backups:/backups

volumes:
  scheduler-config:
  scheduler-backups:
